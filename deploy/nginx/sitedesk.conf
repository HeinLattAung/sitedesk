# /etc/nginx/sites-available/sitedesk
# server-setup.sh replaces example.com with your domain.
# Certbot adds the HTTPS (443) block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Always the newest release (deploy.sh swaps this symlink).
    root /var/www/sitedesk/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10M;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite build files have hashed names, so they can be cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /storage/ {
        expires 30d;
        access_log off;
        # Uploaded files are never executed as PHP.
        location ~ \.php$ { deny all; }
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Any other .php file and dotfiles (.env, .git) are off-limits.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
