; /etc/supervisor/conf.d/sitedesk-worker.conf
; Keeps the Laravel queue worker running (sends contact-form emails).
; deploy.sh restarts it after every release so it loads the new code.

[program:sitedesk-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sitedesk/current/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/sitedesk/current
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/sitedesk/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
